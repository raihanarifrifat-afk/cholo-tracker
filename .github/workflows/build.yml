name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: unzip -o cholo-tracker-android.zip -d src
      - run: cd src && gradle assembleDebug --no-daemon
      - run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk CholoTracker.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest CholoTracker.apk --title "Cholo Tracker" --notes "Android APK"
        env:
          GH_TOKEN: ${{ github.token }}
